server {
    listen 127.0.0.1:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/spektr.crt;
    ssl_certificate_key /etc/nginx/ssl/spektr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/spektr/public;
    index index.php index.html;

    charset utf-8;

    access_log /var/log/nginx/spektr_access.log;
    error_log /var/log/nginx/spektr_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTPS on;
    }
}
